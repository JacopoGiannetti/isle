name: Isle
options:
  bundleIdPrefix: com.jacopogiannetti
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: it
  knownRegions: [it, en, es, fr, de]
  createIntermediateGroups: true
  xcodeVersion: "26.6"

schemes:
  Isle:
    build:
      targets:
        Isle: all
    run:
      config: Debug
      storeKitConfiguration: Isle/Supporting/Isle.storekit
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 3
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7ZST47J92X
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.0.0
  AppsFlyerFramework:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework
    from: 6.14.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  Isle:
    type: application
    platform: iOS
    sources:
      - path: Isle
    dependencies:
      - package: SuperwallKit
      - package: AppsFlyerFramework
        products:
          - AppsFlyerLib
      - package: Firebase
        products:
          - FirebaseCore
          - FirebaseAuth
          - FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacopogiannetti.isle
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Isle/Supporting/Isle.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jacopogiannetti.isle]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: Isle/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Isle
        CFBundleLocalizations: [it, en, es, fr, de]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: "Isle non ha pubblicità. Serve solo a sapere se una nostra inserzione ti ha portato qui, mai niente delle tue isole."
        # Copia dei postback SKAdNetwork ad AppsFlyer: senza, la sua
        # dashboard SKAN è cieca e l'unica lettura dei postback resta
        # quella di Meta, cioè la parte in causa.
        NSAdvertisingAttributionReportEndpoint: https://appsflyer-skadnetwork.com/
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          - CFBundleURLName: com.cherry.jacopogiannetti.app
            CFBundleURLSchemes: [cherry]
        # SKAdNetwork: senza l'id di una rete pubblicitaria qui dentro,
        # le sue campagne iOS non vengono attribuite — e questa lista sta
        # nel binario, quindi aggiungerla dopo costa un update dello
        # Store. Meglio spedirla ora anche se le ads non partono subito.
        # Fonte: tabella ufficiale Google (che include Meta), più
        # ByteDance/TikTok, Snapchat e Reddit dalle rispettive docs.
        # Apple Search Ads non serve: usa AdServices, non SKAN.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork      # Google
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork      # Meta / Facebook
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork      # Meta / Instagram
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork      # TikTok / Pangle
